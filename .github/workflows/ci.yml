name: CI/CD Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=critical || true

      - name: Type Validation
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build Application
        run: npm run build

      - name: Start Preview Server
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8788; then
              echo "Preview server is ready on port 8788!"
              break
            fi
            sleep 1
          done

      - name: Run Smoke Tests
        run: BASE_URL=http://localhost:8788 npm run test:smoke

      - name: Run E2E Tests
        run: BASE_URL=http://localhost:8788 npm run test:e2e
