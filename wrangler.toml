name = "quranific"
compatibility_date = "2026-03-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
# run_worker_first has been intentionally removed. 
# Static assets (images, CSS) will bypass the worker for maximum speed and zero CPU cost.

# Dynamic global edge execution routing
[placement]
mode = "smart"

[vars]
ENVIRONMENT = "production"

# KV binding for API route idempotency checks and dead-letter lead storage
[[kv_namespaces]]
binding = "SESSION"
id = "14eab319d57e4c58b5f903bce3eb3931"

# Telemetry and logging configuration
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[routes]]
pattern = "quranific.com"
custom_domain = true

[[routes]]
pattern = "www.quranific.com"
custom_domain = true