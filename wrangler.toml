name = "quranific"
compatibility_date = "2026-03-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"

# Mandate 1 & 8: Dynamic global edge execution routing
[placement]
mode = "smart"

[vars]
ENVIRONMENT = "production"

# C-1 FIX: Uncommented the SESSION KV binding so the API routes can perform
# idempotency checks and store dead-letter leads when Resend fails.
[[kv_namespaces]]
binding = "SESSION"
id = "14eab319d57e4c58b5f903bce3eb3931"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1