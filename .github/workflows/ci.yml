name: CI/CD Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Type Validation
        run: npm run check

      - name: Build Application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Boot Server and Run Tests
        env:
          BASE_URL: http://127.0.0.1:8788
          CLOUDFLARE_ACCOUNT_ID: "12345678901234567890123456789012"
          CLOUDFLARE_API_TOKEN: "dummy-ci-bypass-token"
          CI: "true"
        run: |
          npm run preview &
          npx wait-on --timeout 60000 tcp:127.0.0.1:8788
          
          echo "Server bound to port. Running Smoke Tests..."
          npm run test:smoke
          
          echo "Running E2E Tests..."
          npm run test:e2e
